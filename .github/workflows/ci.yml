# What a pull request into main has to pass before Kris merges it. Every merge
# into main deploys production, so these checks are the last gate before it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Check the Angular commit convention
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A push that creates the branch has no "before": check its head only.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$HEAD~1"
          fi
          bun scripts/commit-message.ts --range "$BASE..$HEAD"

  check:
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as packages/db/docker-compose.yml, so the
      # test environment below matches apps/server/.env.example.
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: docstore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The OCR tests and the health probe call the real binaries.
      - name: Install Tesseract and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra poppler-utils

      - run: bun install --frozen-lockfile

      - name: Biome
        run: bunx biome ci .

      # apps/web/src/routeTree.gen.ts is generated by the TanStack Start plugin
      # and not versioned; a build of the web app writes it, and the type
      # check of apps/web needs it. Same variables as docker/Dockerfile.
      - name: Generate the route tree
        working-directory: apps/web
        env:
          SKIP_ENV_VALIDATION: "1"
          VITE_SERVER_URL: /
        run: bunx vite build

      - run: bun run check-types

      # Turbo runs in strict env mode and filters the job's environment out of
      # the tasks, so the tests read their variables the way they do locally:
      # from apps/server/.env (see packages/db/src/test-utils.ts). Throwaway
      # secrets, generated per run; createTestDb() derives one database per
      # package from DATABASE_URL_TEST.
      - name: Write the test environment
        run: |
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "BETTER_AUTH_URL=http://localhost:3000"
            echo "CORS_ORIGIN=http://localhost:3001"
            echo "DATABASE_URL=postgresql://postgres:password@localhost:5434/docstore"
            echo "DATABASE_URL_TEST=postgresql://postgres:password@localhost:5434/docstore_test"
            echo "APP_SECRET=$(openssl rand -base64 32)"
            echo "STORAGE_PATH=./data/storage"
          } > apps/server/.env

      - run: bun run test
