name: docstore-dev

services:
  postgres:
    image: postgres:18
    container_name: docstore-postgres-dev
    environment:
      POSTGRES_DB: docstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - docstore_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  docstore_postgres_data:
    name: docstore_docstore_postgres_data
