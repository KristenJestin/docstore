# Project name distinct from the development stack's
# (`packages/db/docker-compose.yml`, project `docstore`): without it a
# production `docker compose down -v` would delete the dev database.
name: docstore-prod

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
  image: docstore-app:latest
  env_file:
    - .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docstore}
      POSTGRES_USER: ${POSTGRES_USER:-docstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - docstore_pg:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docstore} -d ${POSTGRES_DB:-docstore}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    # No published port: Postgres is only reachable from the compose network.

  api:
    <<: *app
    command: ["api"]
    environment:
      PORT: "3000"
      # Built from the POSTGRES_* values; set DATABASE_URL in .env only to override.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-docstore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-docstore}}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost}
      STORAGE_PATH: /data/storage
      # Watched folder: path **as seen by the container**, to be copied as is
      # into the intake source configuration.
      INBOX_PATH: /data/inbox
      # Server-defined intake sources (optional file, see docker/README.md).
      DOCSTORE_CONFIG: /data/config/docstore.json
    volumes:
      - docstore_data:/data
      # Host-side drop folder: any file placed here is ingested then handled
      # according to `afterImport`. Leaving INBOX_PATH_HOST empty mounts an
      # `./inbox` folder next to the compose file.
      - ${INBOX_PATH_HOST:-./inbox}:/data/inbox
      # Server configuration (read-only): drop a `docstore.json` in there to
      # declare intake sources outside the database. Absent file = no
      # server-defined source.
      - ${CONFIG_PATH_HOST:-./config}:/data/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    command: ["web"]
    environment:
      PORT: "3001"
      # Used by the SSR to reach the API without going back through the proxy.
      SERVER_URL: http://api:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${DOMAIN:-:80}
      CADDY_EMAIL_DIRECTIVE: ${ACME_EMAIL:+email }${ACME_EMAIL:-}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-100MB}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  docstore_pg:
  docstore_data:
  caddy_data:
  caddy_config:
